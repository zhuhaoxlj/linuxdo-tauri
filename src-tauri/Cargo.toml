[package]
name = "linuxdo-tauri"
version = "0.1.0"
description = "LinuxDo Tauri Client"
authors = ["mark"]
edition = "2021"

[lib]
name = "linuxdo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
rsa = "0.9"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
url = "2.5"
urlencoding = "2.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
